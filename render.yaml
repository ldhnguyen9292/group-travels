services:
  - type: web
    name: group-travel
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      # The app uses client-side routing, so every unknown path must serve
      # index.html. Without this, opening /trip/<id> directly returns 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite fingerprints filenames in /assets, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # index.html names those fingerprinted files, so it is the only thing that
      # has to be re-fetched for a deploy to reach anyone. Cached, it pins users
      # to the old build indefinitely. Deliberately not declared as /* — that
      # would collide with the immutable rule above.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

      # The service worker is now what actually serves the app offline, so a
      # cached copy of it would pin users to an old precache list — the same
      # trap as a cached index.html, one level down.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig*.json
