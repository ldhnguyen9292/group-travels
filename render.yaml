services:
  - type: web
    name: group-travel
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      # The app uses client-side routing, so every unknown path must serve
      # index.html. Without this, opening /trip/<id> directly returns 404.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite fingerprints filenames in /assets, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig*.json
