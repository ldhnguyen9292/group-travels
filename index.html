<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/group-travel-logo.svg" />
    <!-- Fallback for the places that still will not take an SVG favicon. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      viewport-fit=cover lets the page paint into the notch and home-indicator
      areas; every fixed edge then pays that back with env(safe-area-inset-*).
      Without it the installed app is letterboxed by white bars on an iPhone.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Track group trip expenses and settle up. Works offline, data stays on your device."
    />
    <!-- Overwritten below to match the resolved theme, not just the OS setting. -->
    <meta name="theme-color" content="#f4f5fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Group Travel" />
    <!--
      `default`, not `black-translucent`: translucent puts white status-bar text
      over whatever is underneath, which is unreadable on the light theme.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Group Travel — split trip costs</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          // Keeps the iOS/Android browser chrome from flashing the wrong colour
          // while the bundle loads. ThemeProvider keeps it in sync afterwards.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0e17' : '#f4f5fb');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
